<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Doctor portrait placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CCFBF1"/>
      <stop offset="55%" stop-color="#F5F5F0"/>
      <stop offset="100%" stop-color="#FAEBC9"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5E5E0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <!-- shoulders / white coat -->
  <path d="M40 520 C 70 390 150 350 200 350 C 250 350 330 390 360 520 Z" fill="url(#coat)"/>
  <!-- neck -->
  <rect x="176" y="290" width="48" height="70" rx="12" fill="#D4A680"/>
  <!-- head -->
  <ellipse cx="200" cy="240" rx="78" ry="92" fill="#D4A680"/>
  <!-- hair -->
  <path d="M125 215 C 130 140 270 140 275 215 C 260 190 220 180 200 180 C 180 180 140 190 125 215 Z" fill="#1A1A1A"/>
  <!-- glasses hint -->
  <circle cx="176" cy="235" r="14" fill="none" stroke="#0F766E" stroke-width="2.5"/>
  <circle cx="224" cy="235" r="14" fill="none" stroke="#0F766E" stroke-width="2.5"/>
  <line x1="190" y1="235" x2="210" y2="235" stroke="#0F766E" stroke-width="2.5"/>
  <!-- stethoscope -->
  <path d="M175 395 C 160 430 160 460 185 475" fill="none" stroke="#0F766E" stroke-width="5" stroke-linecap="round"/>
  <path d="M225 395 C 240 430 240 460 215 475" fill="none" stroke="#0F766E" stroke-width="5" stroke-linecap="round"/>
  <circle cx="200" cy="480" r="10" fill="#0F766E"/>
  <!-- caption -->
  <text x="200" y="470" fill="#737373" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" opacity="0.5">PLACEHOLDER</text>
</svg>

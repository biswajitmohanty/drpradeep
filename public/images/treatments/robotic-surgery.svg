<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="Robotic surgery illustration placeholder">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F5F0"/>
      <stop offset="100%" stop-color="#CCFBF1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg2)"/>
  <!-- OR table -->
  <rect x="120" y="300" width="360" height="40" rx="8" fill="#E5E5E0"/>
  <rect x="170" y="340" width="20" height="80" fill="#B0B0A8"/>
  <rect x="410" y="340" width="20" height="80" fill="#B0B0A8"/>
  <!-- patient outline -->
  <rect x="150" y="280" width="300" height="30" rx="15" fill="#FAEBC9"/>
  <!-- robot arm base -->
  <rect x="80" y="80" width="80" height="240" rx="8" fill="#115E59"/>
  <!-- robot arm segments -->
  <rect x="155" y="115" width="200" height="18" rx="9" fill="#0F766E"/>
  <rect x="340" y="125" width="18" height="130" rx="9" fill="#0F766E"/>
  <rect x="320" y="245" width="60" height="22" rx="6" fill="#C8954A"/>
  <!-- knee joint hint -->
  <circle cx="300" cy="295" r="16" fill="none" stroke="#0F766E" stroke-width="3" stroke-dasharray="3,3"/>
  <!-- targeting grid -->
  <line x1="350" y1="260" x2="302" y2="293" stroke="#B91C1C" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
  <!-- monitor -->
  <rect x="440" y="100" width="120" height="85" rx="6" fill="#1A1A1A"/>
  <rect x="452" y="112" width="96" height="61" rx="3" fill="#0F766E" opacity="0.4"/>
  <circle cx="500" cy="142" r="12" fill="none" stroke="#CCFBF1" stroke-width="2"/>
  <line x1="488" y1="142" x2="512" y2="142" stroke="#CCFBF1" stroke-width="1"/>
  <line x1="500" y1="130" x2="500" y2="154" stroke="#CCFBF1" stroke-width="1"/>
  <!-- caption -->
  <text x="300" y="420" fill="#737373" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" opacity="0.6">PLACEHOLDER — robotic-assisted surgery</text>
</svg>
